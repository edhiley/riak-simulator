# Tests, builds and publishes the simulator to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the wasm-bindgen version pinned in wasm/Cargo.toml.
  WASM_BINDGEN: 0.2.100

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}

      - name: Core tests
        run: cargo test --locked -p riak-sim-core

      - name: Build the WebAssembly package
        run: |
          cargo build --release --locked -p riak-sim-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir web/src/wasm/pkg target/wasm32-unknown-unknown/release/riak_sim_wasm.wasm

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Page tests and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
